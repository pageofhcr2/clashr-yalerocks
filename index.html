<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Mini - Auto Chess</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #1e3a8a, #7e22ce);
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #menu-screen, #matchmaking-screen, #gameover-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        #menu-screen h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        .btn {
            background: #eab308;
            border: none;
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            color: #1f2937;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .btn:hover {
            background: #ca8a04;
            transform: scale(1.05);
        }

        .btn:disabled {
            background: #6b7280;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #game-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #top-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, #7f1d1d, #991b1b);
            border-bottom: 4px solid #fbbf24;
        }

        #bottom-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, #1e40af, #1e3a8a);
        }

        .player-info {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .board {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            padding: 20px;
            position: relative;
        }

        .cell {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .cell.occupied {
            cursor: default;
        }

        .cell.highlight {
            background: rgba(234, 179, 8, 0.4);
            border-color: #eab308;
        }

        .mini {
            font-size: 2.5rem;
            position: relative;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .hp-bar {
            position: absolute;
            bottom: 2px;
            left: 10%;
            right: 10%;
            height: 4px;
            background: #1f2937;
            border-radius: 2px;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(to right, #ef4444, #22c55e);
            border-radius: 2px;
            transition: width 0.3s;
        }

        .star-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            color: #fbbf24;
            font-size: 0.8rem;
        }

        #shop-section {
            height: 180px;
            background: #111827;
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
        }

        #shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #shop-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .shop-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .shop-btn:hover:not(:disabled) {
            background: #6d28d9;
            transform: scale(1.05);
        }

        .shop-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #shop-minis {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .shop-mini {
            min-width: 100px;
            height: 100px;
            background: linear-gradient(to bottom, #7c3aed, #6d28d9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .shop-mini:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .shop-mini-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .shop-mini-info {
            font-size: 0.7rem;
            color: white;
            text-align: center;
        }

        .shop-mini-cost {
            position: absolute;
            bottom: 5px;
            background: #fbbf24;
            color: #1f2937;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .phase-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: white;
            font-weight: bold;
            z-index: 1000;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            animation: fadeInOut 2s;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        .loading {
            font-size: 2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hidden {
            display: none !important;
        }

        .error-msg {
            color: #fca5a5;
            margin-top: 1rem;
            font-size: 1rem;
        }

        .info-text {
            color: #d1d5db;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .gold-display {
            color: #fbbf24;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .level-display {
            color: #c084fc;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Menu Screen -->
        <div id="menu-screen">
            <h1>⚔️ Clash Mini Auto Chess 🎲</h1>
            <button class="btn" onclick="startMatchmaking()">🎮 Find Match (1v1)</button>
            <div class="info-text">Build your army and watch them battle!</div>
            <div id="menu-error" class="error-msg"></div>
        </div>

        <!-- Matchmaking Screen -->
        <div id="matchmaking-screen" class="hidden">
            <div class="loading">🔍 Finding opponent...</div>
            <div class="info-text">Please wait</div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="hidden">
            <h1 id="winner-text"></h1>
            <button class="btn" onclick="returnToMenu()">Return to Menu</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <!-- Top Player Board -->
            <div id="top-section">
                <div class="player-info">
                    <span id="top-player-name">Opponent</span>
                    <div class="stats">
                        <span class="level-display">⭐ Level <span id="top-level">1</span></span>
                        <span class="gold-display">💰 <span id="top-gold">0</span></span>
                        <span style="color: #ef4444;">❤️ <span id="top-health">20</span></span>
                    </div>
                </div>
                <div class="board" id="top-board"></div>
            </div>

            <!-- Bottom Player Board -->
            <div id="bottom-section">
                <div class="board" id="bottom-board"></div>
                <div class="player-info">
                    <span id="bottom-player-name">You</span>
                    <div class="stats">
                        <span class="level-display">⭐ Level <span id="bottom-level">1</span></span>
                        <span class="gold-display">💰 <span id="bottom-gold">10</span></span>
                        <span style="color: #22c55e;">❤️ <span id="bottom-health">20</span></span>
                    </div>
                </div>
            </div>

            <!-- Shop Section -->
            <div id="shop-section">
                <div id="shop-header">
                    <div class="gold-display">💰 Gold: <span id="player-gold">10</span></div>
                    <div id="shop-controls">
                        <button class="shop-btn" onclick="refreshShop()" id="refresh-btn">🔄 Refresh (2g)</button>
                        <button class="shop-btn" onclick="levelUp()" id="level-btn">⭐ Level Up (4g)</button>
                        <button class="shop-btn" onclick="readyForBattle()" id="ready-btn">⚔️ Ready!</button>
                    </div>
                </div>
                <div id="shop-minis"></div>
            </div>
        </div>

        <div id="phase-indicator"></div>
    </div>

    <script type="module">
        // Firebase Configuration - REPLACE WITH YOUR CONFIG
        const firebaseConfig = {
  apiKey: "AIzaSyCvLSW4EvEFKlIamsL3lBV3GeDAtkvhhTo",
  authDomain: "tuffmangophonk-fb5bc.firebaseapp.com",
  projectId: "tuffmangophonk-fb5bc",
  storageBucket: "tuffmangophonk-fb5bc.firebasestorage.app",
  messagingSenderId: "199500063543",
  appId: "1:199500063543:web:0c91b7db5c4910b5a5b0b2",
};

        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Mini Units Data
        const MINIS = {
            knight: { name: 'Knight', icon: '🛡️', hp: 150, damage: 20, speed: 1, range: 1, cost: 3, rarity: 'common' },
            archer: { name: 'Archer', icon: '🏹', hp: 80, damage: 15, speed: 1.2, range: 3, cost: 3, rarity: 'common' },
            wizard: { name: 'Wizard', icon: '🧙', hp: 100, damage: 30, speed: 0.8, range: 4, cost: 4, rarity: 'rare' },
            giant: { name: 'Giant', icon: '👹', hp: 300, damage: 40, speed: 0.6, range: 1, cost: 5, rarity: 'rare' },
            dragon: { name: 'Dragon', icon: '🐉', hp: 200, damage: 50, speed: 1.5, range: 2, cost: 6, rarity: 'epic' },
            prince: { name: 'Prince', icon: '🤴', hp: 180, damage: 35, speed: 1.8, range: 1, cost: 4, rarity: 'rare' },
            witch: { name: 'Witch', icon: '🧛', hp: 90, damage: 20, speed: 1, range: 4, cost: 4, rarity: 'rare' },
            golem: { name: 'Golem', icon: '🗿', hp: 400, damage: 30, speed: 0.4, range: 1, cost: 7, rarity: 'epic' }
        };

        // Game State
        let db;
        let playerId = `player_${Math.random().toString(36).substr(2, 9)}`;
        let gameId = null;
        let playerSide = null;
        let gold = 10;
        let level = 1;
        let health = 20;
        let myBoard = [];
        let opponentBoard = [];
        let shopUnits = [];
        let selectedShopUnit = null;
        let gamePhase = 'preparation'; // preparation, battle
        let isReady = false;
        let battleInterval = null;
        let unsubscribe = null;

        // Initialize Firebase
        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                console.log('Firebase initialized');
            } catch (error) {
                document.getElementById('menu-error').textContent = 'Failed to initialize Firebase. Check your config.';
                console.error('Firebase init error:', error);
            }
        }

        // Start matchmaking
        window.startMatchmaking = async function() {
            if (!db) {
                document.getElementById('menu-error').textContent = 'Firebase not initialized';
                return;
            }

            showScreen('matchmaking');

            try {
                await new Promise(resolve => setTimeout(resolve, Math.random() * 500));

                const gamesRef = collection(db, 'games');
                const q = query(gamesRef, where('status', '==', 'waiting'));
                const snapshot = await getDocs(q);

                if (!snapshot.empty) {
                    const gameDoc = snapshot.docs[0];
                    const gameData = gameDoc.data();
                    
                    if (gameData.status === 'waiting' && !gameData.player2) {
                        gameId = gameDoc.id;
                        try {
                            await updateDoc(doc(db, 'games', gameId), {
                                player2: playerId,
                                status: 'playing',
                                phase: 'preparation',
                                round: 1
                            });
                            playerSide = 'top';
                            console.log('Joined game:', gameId);
                            startGame();
                            return;
                        } catch (error) {
                            console.log('Failed to join game:', error);
                        }
                    }
                }

                const docRef = await addDoc(collection(db, 'games'), {
                    player1: playerId,
                    player2: null,
                    status: 'waiting',
                    phase: 'preparation',
                    round: 1,
                    players: {
                        bottom: { health: 20, gold: 10, level: 1, board: [], ready: false },
                        top: { health: 20, gold: 10, level: 1, board: [], ready: false }
                    },
                    createdAt: Date.now()
                });
                gameId = docRef.id;
                playerSide = 'bottom';
                console.log('Created game:', gameId);

                let waitTimeout = setTimeout(() => {
                    if (unsubscribe) unsubscribe();
                    showScreen('menu');
                    document.getElementById('menu-error').textContent = 'No opponent found. Try again.';
                }, 30000);

                unsubscribe = onSnapshot(doc(db, 'games', gameId), (snapshot) => {
                    const data = snapshot.data();
                    if (data && data.status === 'playing' && data.player2) {
                        clearTimeout(waitTimeout);
                        if (unsubscribe) unsubscribe();
                        console.log('Opponent joined!');
                        startGame();
                    }
                });
            } catch (error) {
                console.error('Matchmaking error:', error);
                showScreen('menu');
                document.getElementById('menu-error').textContent = 'Matchmaking failed: ' + error.message;
            }
        };

        // Start game
        function startGame() {
            showScreen('game');
            
            document.getElementById('bottom-player-name').textContent = playerSide === 'bottom' ? 'You (Blue)' : 'Opponent (Red)';
            document.getElementById('top-player-name').textContent = playerSide === 'top' ? 'You (Blue)' : 'Opponent (Red)';
            
            initializeBoards();
            generateShop();
            
            // Listen for game updates
            unsubscribe = onSnapshot(doc(db, 'games', gameId), (snapshot) => {
                const data = snapshot.data();
                if (!data) return;

                const opponentSide = playerSide === 'bottom' ? 'top' : 'bottom';
                
                // Update opponent's board
                if (data.players && data.players[opponentSide]) {
                    opponentBoard = data.players[opponentSide].board || [];
                    renderOpponentBoard();
                    
                    document.getElementById(`${opponentSide}-health`).textContent = data.players[opponentSide].health || 20;
                    document.getElementById(`${opponentSide}-gold`).textContent = data.players[opponentSide].gold || 0;
                    document.getElementById(`${opponentSide}-level`).textContent = data.players[opponentSide].level || 1;
                }

                // Check if both players ready
                if (data.phase === 'preparation' && 
                    data.players?.bottom?.ready && 
                    data.players?.top?.ready) {
                    startBattle();
                }

                // Battle results
                if (data.battleResult) {
                    const result = data.battleResult;
                    if (result.winner === playerSide) {
                        health = Math.max(0, health);
                    } else if (result.loser === playerSide) {
                        health = Math.max(0, health - result.damage);
                        updatePlayerStats();
                    }
                    
                    // Check game over
                    if (data.players[playerSide].health <= 0) {
                        endGame('You Lose! 😢');
                    } else if (data.players[opponentSide].health <= 0) {
                        endGame('You Win! 🎉');
                    }
                }
            });
        }

        // Initialize boards
        function initializeBoards() {
            const topBoard = document.getElementById('top-board');
            const bottomBoard = document.getElementById('bottom-board');
            
            topBoard.innerHTML = '';
            bottomBoard.innerHTML = '';
            
            for (let i = 0; i < 32; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                topBoard.appendChild(cell);
            }
            
            for (let i = 0; i < 32; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => placeUnit(i);
                bottomBoard.appendChild(cell);
            }
        }

        // Generate shop
        function generateShop() {
            shopUnits = [];
            const miniKeys = Object.keys(MINIS);
            
            for (let i = 0; i < 5; i++) {
                const randomMini = miniKeys[Math.floor(Math.random() * miniKeys.length)];
                shopUnits.push({
                    id: `shop_${Date.now()}_${i}`,
                    type: randomMini,
                    ...MINIS[randomMini]
                });
            }
            
            renderShop();
        }

        // Render shop
        function renderShop() {
            const container = document.getElementById('shop-minis');
            container.innerHTML = '';
            
            shopUnits.forEach((unit, index) => {
                const shopMini = document.createElement('div');
                shopMini.className = 'shop-mini';
                shopMini.onclick = () => buyUnit(index);
                
                shopMini.innerHTML = `
                    <div class="shop-mini-icon">${unit.icon}</div>
                    <div class="shop-mini-info">${unit.name}</div>
                    <div class="shop-mini-cost">${unit.cost}g</div>
                `;
                
                container.appendChild(shopMini);
            });
        }

        // Buy unit
        function buyUnit(index) {
            const unit = shopUnits[index];
            if (!unit || gold < unit.cost) return;
            
            selectedShopUnit = { ...unit, id: `unit_${Date.now()}`, hp: unit.hp, maxHp: unit.hp };
            
            // Highlight available cells
            const cells = document.querySelectorAll('#bottom-board .cell');
            cells.forEach(cell => {
                if (!cell.classList.contains('occupied')) {
                    cell.classList.add('highlight');
                }
            });
        }

        // Place unit on board
        function placeUnit(cellIndex) {
            if (!selectedShopUnit) return;
            if (myBoard.find(u => u.position === cellIndex)) return;
            
            gold -= selectedShopUnit.cost;
            myBoard.push({ ...selectedShopUnit, position: cellIndex });
            selectedShopUnit = null;
            
            updatePlayerStats();
            renderMyBoard();
            syncToFirestore();
            
            // Remove highlights
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight'));
        }

        // Render my board
        function renderMyBoard() {
            const cells = document.querySelectorAll('#bottom-board .cell');
            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('occupied');
            });
            
            myBoard.forEach(unit => {
                const cell = cells[unit.position];
                if (cell) {
                    cell.classList.add('occupied');
                    cell.innerHTML = `
                        <div class="mini">${unit.icon}</div>
                        <div class="hp-bar">
                            <div class="hp-fill" style="width: ${(unit.hp / unit.maxHp * 100)}%"></div>
                        </div>
                    `;
                }
            });
        }

        // Render opponent board
        function renderOpponentBoard() {
            const cells = document.querySelectorAll('#top-board .cell');
            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('occupied');
            });
            
            opponentBoard.forEach(unit => {
                const cell = cells[unit.position];
                if (cell) {
                    cell.classList.add('occupied');
                    cell.innerHTML = `
                        <div class="mini">${unit.icon}</div>
                        <div class="hp-bar">
                            <div class="hp-fill" style="width: ${(unit.hp / unit.maxHp * 100)}%"></div>
                        </div>
                    `;
                }
            });
        }

        // Refresh shop
        window.refreshShop = function() {
            if (gold < 2) return;
            gold -= 2;
            generateShop();
            updatePlayerStats();
            syncToFirestore();
        };

        // Level up
        window.levelUp = function() {
            if (gold < 4) return;
            gold -= 4;
            level++;
            updatePlayerStats();
            syncToFirestore();
        };

        // Ready for battle
        window.readyForBattle = async function() {
            isReady = true;
            document.getElementById('ready-btn').disabled = true;
            
            await updateDoc(doc(db, 'games', gameId), {
                [`players.${playerSide}.ready`]: true
            });
            
            showPhaseIndicator('⏳ Waiting for opponent...');
        };

        // Start battle
        async function startBattle() {
            gamePhase = 'battle';
            showPhaseIndicator('⚔️ BATTLE!');
            
            document.getElementById('shop-section').style.display = 'none';
            
            // Simulate battle
            setTimeout(async () => {
                const myUnitsAlive = myBoard.filter(u => u.hp > 0).length;
                const opponentUnitsAlive = opponentBoard.filter(u => u.hp > 0).length;
                
                let winner, loser, damage;
                if (myUnitsAlive > opponentUnitsAlive) {
                    winner = playerSide;
                    loser = playerSide === 'bottom' ? 'top' : 'bottom';
                    damage = Math.max(1, myUnitsAlive - opponentUnitsAlive);
                } else if (opponentUnitsAlive > myUnitsAlive) {
                    loser = playerSide;
                    winner = playerSide === 'bottom' ? 'top' : 'bottom';
                    damage = Math.max(1, opponentUnitsAlive - myUnitsAlive);
                } else {
                    // Draw
                    winner = null;
                    loser = null;
                    damage = 0;
                }
                
                if (loser === playerSide) {
                    health -= damage;
                }
                
                // Reset for next round
                gold += 5;
                isReady = false;
                gamePhase = 'preparation';
                
                updatePlayerStats();
                document.getElementById('shop-section').style.display = 'flex';
                document.getElementById('ready-btn').disabled = false;
                generateShop();
                
                await updateDoc(doc(db, 'games', gameId), {
                    [`players.${playerSide}.ready`]: false,
                    [`players.${playerSide}.health`]: health,
                    [`players.${playerSide}.gold`]: gold,
                    battleResult: { winner, loser, damage, timestamp: Date.now() }
                });
                
                if (health <= 0) {
                    endGame('You Lose! 😢');
                }
            }, 3000);
        }

        // Show phase indicator
        function showPhaseIndicator(text) {
            const indicator = document.getElementById('phase-indicator');
            indicator.textContent = text;
            indicator.style.display = 'block';
            setTimeout(() => {
                indicator.style.display = 'none';
            }, 2000);
        }

        // Update player stats
        function updatePlayerStats() {
            document.getElementById('player-gold').textContent = gold;
            document.getElementById('bottom-gold').textContent = gold;
            document.getElementById('bottom-health').textContent = health;
            document.getElementById('bottom-level').textContent = level;
        }

        // Sync to Firestore
        async function syncToFirestore() {
            if (!db || !gameId) return;
            try {
                await updateDoc(doc(db, 'games', gameId), {
                    [`players.${playerSide}`]: {
                        health,
                        gold,
                        level,
                        board: myBoard,
                        ready: isReady
                    }
                });
            } catch (error) {
                console.error('Error syncing:', error);
            }
        }

        // End game
        function endGame(message) {
            if (battleInterval) clearInterval(battleInterval);
            if (unsubscribe) unsubscribe();
            
            document.getElementById('winner-text').textContent = message;
            showScreen('gameover');
        }

        // Return to menu
        window.returnToMenu = function() {
            if (battleInterval) clearInterval(battleInterval);
            if (unsubscribe) unsubscribe();
            
            gameId = null;
            playerSide = null;
            gold = 10;
            level = 1;
            health = 20;
            myBoard = [];
            opponentBoard = [];
            isReady = false;
            
            showScreen('menu');
        };

        // Show screen
        function showScreen(screen) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('matchmaking-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            
            document.getElementById(screen + '-screen').classList.remove('hidden');
        }

        // Initialize
        initFirebase();
    </script>
</body>
</html>
