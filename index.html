<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoChess Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        #config-screen, #lobby-screen, #game-screen, #replay-screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            height: 150px;
            font-family: monospace;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .player-info {
            text-align: center;
        }

        .player-info h3 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .health {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
        }

        .gold {
            font-size: 20px;
            font-weight: bold;
            color: #f39c12;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            gap: 10px;
            margin: 20px auto;
            justify-content: center;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: #ecf0f1;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .cell:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .cell.occupied {
            background: #3498db;
            border-color: #2980b9;
        }

        .cell.enemy {
            background: #e74c3c;
            border-color: #c0392b;
        }

        .unit {
            color: white;
            font-weight: bold;
            text-align: center;
            font-size: 24px;
        }

        .unit-name {
            font-size: 10px;
            margin-top: 2px;
        }

        .unit-hp {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .shop {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .shop h3 {
            color: white;
            margin-bottom: 15px;
        }

        .shop-items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .shop-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 3px solid transparent;
            min-width: 100px;
        }

        .shop-item:hover {
            transform: scale(1.05);
            border-color: #f39c12;
        }

        .shop-item.selected {
            border-color: #2ecc71;
        }

        .shop-item .icon {
            font-size: 32px;
        }

        .shop-item .cost {
            color: #f39c12;
            font-weight: bold;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .phase-indicator {
            text-align: center;
            padding: 10px;
            background: #2ecc71;
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .phase-indicator.battle {
            background: #e74c3c;
        }

        .waiting {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            margin: 20px 0;
        }

        .battle-log {
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
        }

        .battle-log div {
            margin: 5px 0;
            padding: 3px 0;
        }

        .damage {
            color: #e74c3c;
        }

        .heal {
            color: #2ecc71;
        }

        #matchmaking-status {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .replay-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ AutoChess Battle Arena</h1>

        <div id="config-screen" class="screen active">
            <div class="input-group">
                <label>Firebase Configuration (JSON):</label>
                <textarea id="firebase-config" placeholder='{"apiKey": "AIzaSyCvLSW4EvEFKlIamsL3lBV3GeDAtkvhhTo", "authDomain": "tuffmangophonk-fb5bc.firebaseapp.com", "projectId": "tuffmangophonk-fb5bc", "storageBucket": "tuffmangophonk-fb5bc.firebasestorage.app", "messagingSenderId": "199500063543", "appId": "1:199500063543:web:0c91b7db5c4910b5a5b0b2"}'></textarea>
            </div>
            <div class="input-group">
                <label>Your Name:</label>
                <input type="text" id="player-name" placeholder="Enter your name">
            </div>
            <div style="text-align: center;">
                <button onclick="initializeFirebase()">Connect to Game</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen">
            <div id="matchmaking-status">
                <h2>Finding Opponent...</h2>
                <div class="spinner"></div>
                <p>Waiting for another player to join...</p>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="phase-indicator" id="phase-indicator">Preparation Phase</div>
            
            <div class="game-info">
                <div class="player-info">
                    <h3 id="player1-name">You</h3>
                    <div class="health">❤️ <span id="player1-health">20</span></div>
                    <div class="gold">💰 <span id="player1-gold">10</span></div>
                </div>
                <div class="player-info">
                    <div style="font-size: 14px; color: #7f8c8d;">Round <span id="round-number">1</span></div>
                </div>
                <div class="player-info">
                    <h3 id="player2-name">Opponent</h3>
                    <div class="health">❤️ <span id="player2-health">20</span></div>
                    <div class="gold">💰 <span id="player2-gold">10</span></div>
                </div>
            </div>

            <div class="board" id="board"></div>

            <div id="waiting-message" class="waiting" style="display: none;">
                Waiting for opponent to finish their turn...
            </div>

            <div class="shop" id="shop">
                <h3>🛒 Shop (Auto-refreshes when you place a unit)</h3>
                <div class="shop-items" id="shop-items"></div>
            </div>

            <div class="actions">
                <button id="ready-btn" onclick="readyForBattle()">Ready for Battle!</button>
            </div>

            <div class="battle-log" id="battle-log" style="display: none;"></div>
        </div>

        <div id="replay-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px;">Battle Replay</h2>
            <div class="board" id="replay-board"></div>
            <div class="battle-log" id="replay-log"></div>
            <div class="replay-controls">
                <button onclick="replayBattle()">▶️ Replay Battle</button>
                <button onclick="nextRound()">➡️ Next Round</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        let db, gameId, playerId, playerNumber;
        let selectedUnit = null;
        let gameState = {
            player1: { health: 20, gold: 10, board: [], ready: false },
            player2: { health: 20, gold: 10, board: [], ready: false },
            phase: 'prep',
            round: 1,
            battleLog: []
        };
        let unsubscribe = null;
        let currentBattleLog = [];

        const UNITS = [
            { id: 'knight', name: 'Knight', icon: '🗡️', cost: 3, hp: 15, atk: 5, spd: 3 },
            { id: 'archer', name: 'Archer', icon: '🏹', cost: 3, hp: 10, atk: 7, spd: 4 },
            { id: 'mage', name: 'Mage', icon: '🔮', cost: 4, hp: 8, atk: 10, spd: 2 },
            { id: 'tank', name: 'Tank', icon: '🛡️', cost: 5, hp: 25, atk: 3, spd: 1 },
            { id: 'ninja', name: 'Ninja', icon: '🥷', cost: 4, hp: 12, atk: 8, spd: 5 },
            { id: 'dragon', name: 'Dragon', icon: '🐉', cost: 6, hp: 20, atk: 12, spd: 3 }
        ];

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initializeFirebase() {
            const configText = document.getElementById('firebase-config').value.trim();
            const playerName = document.getElementById('player-name').value.trim();

            if (!configText || !playerName) {
                alert('Please enter both Firebase config and your name!');
                return;
            }

            try {
                const config = JSON.parse(configText);
                firebase.initializeApp(config);
                db = firebase.firestore();
                playerId = playerName + '_' + Date.now();
                findMatch();
            } catch (e) {
                alert('Invalid Firebase configuration: ' + e.message);
            }
        }

        async function findMatch() {
            showScreen('lobby-screen');

            const gamesRef = db.collection('games');
            const availableGames = await gamesRef.where('status', '==', 'waiting').limit(1).get();

            if (!availableGames.empty) {
                const game = availableGames.docs[0];
                gameId = game.id;
                playerNumber = 2;
                
                await gamesRef.doc(gameId).update({
                    player2: playerId,
                    player2Name: document.getElementById('player-name').value,
                    status: 'active'
                });
            } else {
                const newGame = await gamesRef.add({
                    player1: playerId,
                    player1Name: document.getElementById('player-name').value,
                    player2: null,
                    player2Name: null,
                    status: 'waiting',
                    state: gameState,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                gameId = newGame.id;
                playerNumber = 1;
            }

            listenToGame();
        }

        function listenToGame() {
            unsubscribe = db.collection('games').doc(gameId).onSnapshot(doc => {
                const data = doc.data();
                
                if (data.status === 'active' && data.state) {
                    gameState = data.state;
                    updateGameUI();
                    showScreen('game-screen');
                }
            });
        }

        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => placeUnit(i);
                board.appendChild(cell);
            }
        }

        function generateShop() {
            const shopItems = document.getElementById('shop-items');
            shopItems.innerHTML = '';
            
            const shuffled = [...UNITS].sort(() => Math.random() - 0.5);
            const shopUnits = shuffled.slice(0, 3);

            shopUnits.forEach(unit => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.onclick = () => selectUnit(unit);
                item.innerHTML = `
                    <div class="icon">${unit.icon}</div>
                    <div>${unit.name}</div>
                    <div class="cost">💰 ${unit.cost}</div>
                    <div style="font-size: 10px; color: #7f8c8d;">
                        HP: ${unit.hp} | ATK: ${unit.atk}
                    </div>
                `;
                shopItems.appendChild(item);
            });
        }

        function selectUnit(unit) {
            selectedUnit = unit;
            document.querySelectorAll('.shop-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.target.closest('.shop-item').classList.add('selected');
        }

        async function placeUnit(index) {
            if (!selectedUnit || gameState.phase !== 'prep') return;

            const myKey = 'player' + playerNumber;
            const myGold = gameState[myKey].gold;
            const myBoard = gameState[myKey].board;

            if (myGold < selectedUnit.cost) {
                alert('Not enough gold!');
                return;
            }

            if (myBoard.find(u => u.pos === index)) {
                alert('Cell already occupied!');
                return;
            }

            const newUnit = {
                ...selectedUnit,
                pos: index,
                currentHp: selectedUnit.hp,
                id: selectedUnit.id + '_' + Date.now()
            };

            myBoard.push(newUnit);
            gameState[myKey].gold -= selectedUnit.cost;
            gameState[myKey].board = myBoard;

            await db.collection('games').doc(gameId).update({ state: gameState });
            
            selectedUnit = null;
            generateShop();
            updateGameUI();
        }

        async function readyForBattle() {
            const myKey = 'player' + playerNumber;
            gameState[myKey].ready = true;
            await db.collection('games').doc(gameId).update({ state: gameState });

            if (gameState.player1.ready && gameState.player2.ready) {
                await simulateBattle();
            } else {
                document.getElementById('waiting-message').style.display = 'block';
            }
        }

        async function simulateBattle() {
            gameState.phase = 'battle';
            currentBattleLog = [];
            await db.collection('games').doc(gameId).update({ state: gameState });

            const p1Units = [...gameState.player1.board].map(u => ({...u, owner: 1}));
            const p2Units = [...gameState.player2.board].map(u => ({...u, owner: 2}));
            let allUnits = [...p1Units, ...p2Units].sort((a, b) => b.spd - a.spd);

            currentBattleLog.push('⚔️ Battle Start!');

            while (p1Units.filter(u => u.currentHp > 0).length > 0 && 
                   p2Units.filter(u => u.currentHp > 0).length > 0) {
                
                for (let unit of allUnits) {
                    if (unit.currentHp <= 0) continue;

                    const enemies = unit.owner === 1 ? p2Units : p1Units;
                    const aliveEnemies = enemies.filter(e => e.currentHp > 0);
                    
                    if (aliveEnemies.length === 0) break;

                    const target = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                    target.currentHp -= unit.atk;

                    currentBattleLog.push(
                        `${unit.icon} ${unit.name} attacks ${target.icon} ${target.name} for ${unit.atk} damage!`
                    );

                    if (target.currentHp <= 0) {
                        currentBattleLog.push(`💀 ${target.icon} ${target.name} defeated!`);
                    }

                    await new Promise(resolve => setTimeout(resolve, 500));
                    displayBattleLog();
                }
            }

            const p1Alive = p1Units.filter(u => u.currentHp > 0).length;
            const p2Alive = p2Units.filter(u => u.currentHp > 0).length;

            if (p1Alive > p2Alive) {
                gameState.player2.health -= 3;
                currentBattleLog.push('🏆 Player 1 wins this round!');
            } else if (p2Alive > p1Alive) {
                gameState.player1.health -= 3;
                currentBattleLog.push('🏆 Player 2 wins this round!');
            } else {
                currentBattleLog.push('🤝 Draw! No damage dealt.');
            }

            gameState.battleLog = currentBattleLog;

            if (gameState.player1.health <= 0 || gameState.player2.health <= 0) {
                const winner = gameState.player1.health > 0 ? 'Player 1' : 'Player 2';
                currentBattleLog.push(`🎉 ${winner} wins the game!`);
                gameState.phase = 'ended';
            } else {
                gameState.phase = 'replay';
            }

            await db.collection('games').doc(gameId).update({ state: gameState });
            showReplay();
        }

        function displayBattleLog() {
            const logDiv = document.getElementById('battle-log');
            logDiv.style.display = 'block';
            logDiv.innerHTML = currentBattleLog.map(log => `<div>${log}</div>`).join('');
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function showReplay() {
            showScreen('replay-screen');
            const replayLog = document.getElementById('replay-log');
            replayLog.innerHTML = gameState.battleLog.map(log => `<div>${log}</div>`).join('');
            updateReplayBoard();
        }

        function updateReplayBoard() {
            const board = document.getElementById('replay-board');
            board.innerHTML = '';
            
            for (let i = 0; i < 10; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const p1Unit = gameState.player1.board.find(u => u.pos === i);
                const p2Unit = gameState.player2.board.find(u => u.pos === i);
                
                if (p1Unit) {
                    cell.classList.add('occupied');
                    cell.innerHTML = `
                        <div class="unit">${p1Unit.icon}</div>
                        <div class="unit-name">${p1Unit.name}</div>
                    `;
                } else if (p2Unit) {
                    cell.classList.add('enemy');
                    cell.innerHTML = `
                        <div class="unit">${p2Unit.icon}</div>
                        <div class="unit-name">${p2Unit.name}</div>
                    `;
                }
                
                board.appendChild(cell);
            }
        }

        function replayBattle() {
            const replayLog = document.getElementById('replay-log');
            replayLog.innerHTML = '';
            
            let i = 0;
            const interval = setInterval(() => {
                if (i >= gameState.battleLog.length) {
                    clearInterval(interval);
                    return;
                }
                const logEntry = document.createElement('div');
                logEntry.textContent = gameState.battleLog[i];
                replayLog.appendChild(logEntry);
                replayLog.scrollTop = replayLog.scrollHeight;
                i++;
            }, 500);
        }

        async function nextRound() {
            if (gameState.phase === 'ended') {
                alert('Game has ended!');
                return;
            }

            gameState.round++;
            gameState.player1.gold = 10 + gameState.round;
            gameState.player2.gold = 10 + gameState.round;
            gameState.player1.board = [];
            gameState.player2.board = [];
            gameState.player1.ready = false;
            gameState.player2.ready = false;
            gameState.phase = 'prep';
            gameState.battleLog = [];

            await db.collection('games').doc(gameId).update({ state: gameState });
            showScreen('game-screen');
            updateGameUI();
        }

        function updateGameUI() {
            document.getElementById('phase-indicator').textContent = 
                gameState.phase === 'prep' ? 'Preparation Phase' : 
                gameState.phase === 'battle' ? 'Battle in Progress!' :
                gameState.phase === 'replay' ? 'Battle Ended - View Replay' : 'Game Ended';
            
            document.getElementById('phase-indicator').className = 
                'phase-indicator' + (gameState.phase === 'battle' ? ' battle' : '');

            document.getElementById('round-number').textContent = gameState.round;
            document.getElementById('player1-health').textContent = gameState.player1.health;
            document.getElementById('player2-health').textContent = gameState.player2.health;
            document.getElementById('player1-gold').textContent = gameState.player1.gold;
            document.getElementById('player2-gold').textContent = gameState.player2.gold;

            const readyBtn = document.getElementById('ready-btn');
            readyBtn.disabled = gameState.phase !== 'prep';

            const myKey = 'player' + playerNumber;
            if (gameState[myKey].ready) {
                document.getElementById('waiting-message').style.display = 'block';
            } else {
                document.getElementById('waiting-message').style.display = 'none';
            }

            updateBoard();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('#board .cell');
            cells.forEach((cell, i) => {
                cell.className = 'cell';
                cell.innerHTML = '';

                const myKey = 'player' + playerNumber;
                const myUnit = gameState[myKey].board.find(u => u.pos === i);

                if (myUnit) {
                    cell.classList.add('occupied');
                    cell.innerHTML = `
                        <div class="unit">${myUnit.icon}</div>
                        <div class="unit-name">${myUnit.name}</div>
                        <div class="unit-hp">HP: ${myUnit.currentHp}</div>
                    `;
                }
            });
        }

        initBoard();
        generateShop();
    </script>
</body>
</html>
